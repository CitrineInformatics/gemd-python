name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  pr-checks:
    uses: CitrineInformatics/common-gh-actions/.github/workflows/repo-checks.yml@v3
    with:
      src: gemd
      check_version_bump: ${{ github.base_ref == 'main' }}
      check_docs: true
